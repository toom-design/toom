<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heritage of Savile Row — TOOM Studio</title>
  <meta name="description" content="Heritage of Savile Row — a new collection from TOOM Studio, coming soon.">
  <meta property="og:title" content="Heritage of Savile Row — TOOM Studio">
  <meta property="og:image" content="Savile_Row/savile-row.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/bee-teal.png">
  <style>
    *{box-sizing:border-box;} html,body{margin:0;padding:0;}
    body{background:#f3f2ef;font-family:"Archivo",sans-serif;}
    ::selection{background:#3ebfa6;color:#3a1140;}
    a{color:inherit;}

    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      height: 52px;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
    .site-nav-left { display: flex; align-items: center; }
    .site-nav-left a { color: rgba(243,242,239,0.92); transition: color 0.25s ease; }
    .site-nav-left svg { transition: stroke 0.25s ease; }
    .site-nav-center { display: flex; align-items: center; gap: 28px; justify-content: center; }
    .site-nav-right { display: flex; align-items: center; justify-content: flex-end; }
    .site-nav a, .site-nav span {
      font-size: 13px; font-weight: 400; letter-spacing: 0.10em;
      text-transform: uppercase; color: rgba(243,242,239,0.85);
      text-decoration: none; white-space: nowrap; transition: color 0.25s ease;
    }
    .site-nav a:hover { color: #f3f2ef; }
    .site-nav.on-light {
      background: #FAFAF8;
      border-bottom: 1px solid rgba(26,25,22,0.10);
    }
    .site-nav.on-light .site-nav-left a { color: rgba(26,25,22,0.92); }
    .site-nav.on-light .site-nav-left svg { stroke: rgba(26,25,22,0.92); }
    .site-nav.on-light a, .site-nav.on-light span { color: rgba(26,25,22,0.65); }
    .site-nav.on-light a:hover { color: #1a1916; }

    .hero {
      position: relative;
      height: 100svh;
      min-height: 560px;
      background: #1a1016;
      background-image: url('Savile_Row/savile-row.jpg');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(18,11,16,.55) 0%, rgba(18,11,16,.35) 40%, rgba(18,11,16,.7) 100%);
    }
    .center {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      color: #f3f2ef;
    }
    .eyebrow { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #3ebfa6; margin-bottom: 22px; }
    .center h1 { margin: 0 0 24px; font-weight: 500; font-family: 'Cormorant Garamond', serif; font-size: 64px; line-height: .96; letter-spacing: -.01em; }
    .center p { margin: 0 0 40px; font-size: 16px; line-height: 1.6; color: rgba(243,242,239,.72); max-width: 400px; }
    .back { display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(243,242,239,.4); padding: 12px 22px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #f3f2ef; text-decoration: none; }

    footer { padding: 40px 56px; border-top: 1px solid #e4e0d8; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .08em; color: #9a958c; text-align: right; }

    @media(max-width:768px){
      .site-nav{padding:0 16px;}
      .site-nav-center{gap:16px;}
      .site-nav a,.site-nav span{font-size:11px;}
      .center h1{font-size:40px;}
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <div class="site-nav-left">
      <a href="index.html" style="line-height:0;">
        <svg viewBox="0 0 229.18 65.81" role="img" aria-label="TOOM" style="height:26px;width:auto;display:block;" fill="none" stroke="rgba(243,242,239,0.92)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M61.69,20.37v25.06c0,1.02.54,1.95,1.42,2.46l21.71,12.53c.88.51,1.96.51,2.84,0l21.71-12.53c.88-.51,1.42-1.45,1.42-2.46v-25.06c0-1.02-.54-1.95-1.42-2.46l-21.71-12.53c-.88-.51-1.96-.51-2.84,0l-21.71,12.53c-.88.51-1.42,1.45-1.42,2.46Z"></path><path d="M118.39,20.37v25.06c0,1.02.54,1.95,1.42,2.46l21.71,12.53c.88.51,1.96.51,2.84,0l21.71-12.53c.88-.51,1.42-1.45,1.42-2.46v-25.06c0-1.02-.54-1.95-1.42-2.46l-21.71-12.53c-.88-.51-1.96-.51-2.84,0l-21.71,12.53c-.88.51-1.42,1.45-1.42,2.46Z"></path><line x1="29.55" y1="8.36" x2="29.55" y2="57.46"></line><line x1="5" y1="8.36" x2="54.1" y2="8.36"></line><polyline points="175.08 57.46 175.08 8.36 199.63 30.85 224.18 8.36 224.18 57.46"></polyline></svg>
      </a>
    </div>
    <div class="site-nav-center">
      <a href="https://tailortech.toom.design/configure" target="_blank" rel="noopener">Tailortech</a>
      <a href="collections.html">Collections</a>
      <a href="about.html">About</a>
    </div>
    <div class="site-nav-right"></div>
  </nav>

  <div class="hero js-hero">
    <div class="hero-overlay"></div>
    <div class="center">
      <div class="eyebrow">Coming Soon</div>
      <h1>Heritage of<br>Savile Row</h1>
      <p>We are working hard on this page. Thank you for your patience.</p>
      <a href="collections.html" class="back">← Back to Collections</a>
    </div>
  </div>

  <footer>© 2026 TOOM STUDIO</footer>

  <div style="position:fixed;bottom:12px;right:16px;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.08em;color:rgba(150,145,140,.5);pointer-events:none;z-index:999;">v1.0.0</div>

  <script>
    (function () {
      var nav = document.querySelector('.site-nav');
      var hero = document.querySelector('.js-hero');
      if (!nav) return;
      if (!hero) { nav.classList.add('on-light'); return; }

      function updateNavColor() {
        var navHeight = nav.offsetHeight;
        var heroBottom = hero.getBoundingClientRect().bottom;
        if (heroBottom <= navHeight) {
          nav.classList.add('on-light');
        } else {
          nav.classList.remove('on-light');
        }
      }

      updateNavColor();
      window.addEventListener('scroll', updateNavColor, { passive: true });
      window.addEventListener('resize', updateNavColor);
    })();
  </script>
</body>
</html>
